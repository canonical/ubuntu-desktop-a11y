name: ubuntu-desktop-a11y
base: core26
version: "0.1+git20261118"
# T47 (the T40 C13 lint): the store metadata keys. The three repo URLs
# below are the INTENDED GitHub home - THE REPO HAS NO REMOTE TODAY.
# *** OWNER ACTION REQUIRED BEFORE ANY STORE UPLOAD: confirm/correct
# source-code, issues and website once the repository lands at its
# real home (these point at
# https://github.com/canonical/ubuntu-desktop-a11y per the T47
# deliverable; if the repo is published elsewhere or renamed, these
# three values must be updated, or the store listing will advertise a
# wrong source). `contact` is the owner's address as briefed. ***
title: Ubuntu Desktop Accessibility
contact: chris.bainbridge@canonical.com
source-code: https://github.com/canonical/ubuntu-desktop-a11y
issues: https://github.com/canonical/ubuntu-desktop-a11y/issues
website: https://github.com/canonical/ubuntu-desktop-a11y
summary: Accessibility provider snap (AT-SPI bus, Orca, speech-dispatcher)
description: |
  Spike 1 of the thin-line accessibility work: one strictly confined
  accessibility provider on the STOCK core26 base, implementing the
  T11 design review (notes/todo/a11y-work/T11-thin-a11y-design-review.txt
  sections 2-4).

  Three apps in one snap (socket/label relationships are the unproven
  boundary, so the payload is not split):

    bus                at-spi-bus-launcher owning org.a11y.Bus on the
                       session bus (dbus slot + activates-on). It spawns
                       its own private accessibility dbus-daemon and
                       activates at-spi2-registryd from staged config;
                       nothing here is hand-orchestrated.
    orca               screen reader with the python3/gi/typelib stack.
    speech-dispatcher  snapd socket-activated user speech daemon with
                       the espeak-ng output module; audio goes to the
                       pipewire snap via the audio-playback plug.

  Staging regular debs (stage-packages) is normal snap packaging; the
  fat/thin staging restriction the project enforces is base-snap
  specific (T10) and does not apply here. This snap is meant to be
  image-seeded with its connections established before the session
  starts (T11 review section 6).
# grade flipped to "stable" at the start of the shipping phase (T29
# C13 release hygiene, T40): T11 gates 1-8 ALL pass on the thin line
# as of 2026-11-16 (gate 8 = the owner's live human session). The
# gate-2 STORE re-test with real store egress is still on the
# follow-up list (T25 ran it network-blocked, calculator sideloaded),
# but grade=stable is a hard requirement for any store upload (devel
# snaps cannot promote), so it ships flipped. The 0.1+git<date>
# version scheme is likewise a store-rename decision for the owner.
grade: stable
confinement: strict
license: GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# Absolute paths that at-spi-bus-launcher / dbus-daemon / libespeak-ng
# reach for inside the mount namespace (verified via strings on the
# 2.60.4 debs; core26 rev 750 ships none of these paths, so every
# layout here is conflict-free):
#  - /usr/share/defaults/at-spi2/accessibility.conf
#      launcher passes --config-file=/usr/share/defaults/at-spi2/
#      accessibility.conf (after checking /etc/at-spi2/, which neither
#      base nor snap ship). Preserves <type>accessibility</type>.
#  - /usr/share/dbus-1/accessibility-services
#      <servicedir> in accessibility.conf; the private bus activates
#      org.a11y.atspi.Registry from here; the service file execs
#      /usr/libexec/at-spi2-registryd, hence the symlink layout below.
#  - /usr/bin/dbus-daemon
#      NOT laid out: core26 ships it, the launcher's compiled-in
#      fallback path hits the base's binary directly, and the strict
#      AppArmor template already grants it ixr
#      (interfaces/apparmor/template.go:566). A symlink layout would
#      fail anyway: snap-update-ns refuses to replace an existing base
#      file (cmd/snap-update-ns/change.go:187 "existing file in the
#      way") and the base does not ship dbus-broker-launch, so the
#      launcher deterministically uses the mediation-capable
#      dbus-daemon.
#  - /usr/lib/x86_64-linux-gnu/espeak-ng-data
#      libespeak-ng's compiled-in data path; env fallback
#      ESPEAK_DATA_PATH is also set in the speech-dispatcher #      ESPEAK_DATA_PATH is also set in the speech-dispatcher wrapper.
#  - /usr/share/X11/xkb
#      T16 finding: with the wayland grant (orca wayland plug) Gdk
#      opens the display but xkbcommon dies at "Failed to add any
#      default include path (system path: /usr/share/X11/xkb)" - the
#      base ships no xkb data (verified /snap/core26/current). Bind
#      the staged xkb-data (the xkeyboard-config source binary) there.
layout:
  /usr/share/defaults/at-spi2:
    bind: $SNAP/usr/share/defaults/at-spi2
  /usr/share/dbus-1/accessibility-services:
    bind: $SNAP/usr/share/dbus-1/accessibility-services
  /usr/libexec/at-spi2-registryd:
    symlink: $SNAP/usr/libexec/at-spi2-registryd
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/espeak-ng-data:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/espeak-ng-data
  # xkb-data on 26.04 ships the data in /usr/share/xkeyboard-config-2/
  # with /usr/share/X11/xkb as a compat SYMLINK (xkb -> ../xkeyboard-
  # config-2); a bind layout would fail the pack-time directory check on
  # the symlink, so reproduce the deb's shape with a symlink layout to
  # the staged real directory.
  /usr/share/X11/xkb:
    symlink: $SNAP/usr/share/xkeyboard-config-2
  # T13 runtime finding: speech-dispatcher's compiled-in config path is
  # /etc/speech-dispatcher/speechd.conf; core26 ships no such dir so the
  # daemon exits with "Error opening configuration file". Bind the
  # staged config there (conflict-free: the base lacks the path).
  /etc/speech-dispatcher:
    bind: $SNAP/etc/speech-dispatcher
  # T23 follow-up to the staged nsswitch chain (see the a11y-stack
  # override-stage): core26 ships /etc/nsswitch.conf, so the modified
  # file cannot be staged at that path (snapcraft prime excludes base
  # content); bind-file the staged copy over the base's file inside this
  # snap's namespace. /etc is not on snapd's layout rejection list and
  # bind-file over an existing base file is the supported replacement
  # shape (snapd snap/validate.go: only the off-limits list + $SNAP
  # source rules; a symlink layout is the one that cannot replace an
  # existing file - snap-update-ns change.go:187).
  /etc/nsswitch.conf:
    bind-file: $SNAP/etc/a11y-nsswitch.conf
  # T13 runtime finding #2: the output modules are exec'd from the
  # compiled-in /usr/lib/speech-dispatcher-modules/ (base lacks the
  # dir; the daemon logged "Exec of module ... failed with error 2").
  /usr/lib/speech-dispatcher-modules:
    bind: $SNAP/usr/lib/speech-dispatcher-modules
  # T20 E3 follow-up: the espeak output module (and the pulse audio
  # plugin the server dlopens) need libpulsecommon-17.0.so, staged
  # under $SNAP/usr/lib/<triplet>/pulseaudio/. Neither the module's
  # absolute RPATH nor LD_LIBRARY_PATH reached that subdir in-ns
  # (verbatim ldd in the x13 namespace: "libpulsecommon-17.0.so =>
  # not found"), so sd_espeak-ng died at loader stage and speechd fell
  # back to dummy - the wrong-module half of the E3 crash. Bind the
  # staged dir at its absolute deb path (conflict-free: core26 ships
  # no pulseaudio at all) so the deb's own RPATH resolves.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio
  # T20 E3 follow-up #2: the espeak module's server-side audio opens
  # the pulse plugin at the absolute /usr/lib/<triplet>/speech-
  # dispatcher/spd_pulse.so (verbatim speechd log: "Opening audio
  # failed: Cannot open plugin pulse in /usr/lib/x86_64-linux-gnu/
  # speech-dispatcher/spd_pulse. error: file not found"). The plugins
  # are staged (speech-dispatcher-audio-plugins) but that dir has no
  # layout; on the fat test image the host's plugin dir (alsa/libao/
  # oss only - no pulse) shadows nothing, on a thin base the dir does
  # not exist at all. Bind the staged dir over the absolute path.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/speech-dispatcher:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/speech-dispatcher
  # T50: the speechd locale pronunciation dictionaries. The deb stages
  # them at $SNAP/usr/share/speech-dispatcher/locale/ (verified in the
  # packed artifact: 182 language dirs, 366 .dic files) but the
  # server's compiled-in lookup path is the ABSOLUTE
  # /usr/share/speech-dispatcher/locale (symbols.c:724, LOCALE_DATA),
  # which resolves against the BASE's /usr in this snap's namespace -
  # core26 ships no speech-dispatcher at all, so every lookup failed
  # ("Failed to open file '/usr/share/speech-dispatcher/locale/en_US/
  # gender-neutral.dic'" - the owner's benign-'c'-locale noise; the
  # symbols/emojis dictionaries that DO exist staged never loaded).
  # Bind the staged tree at the compiled-in path (the same pattern as
  # the modules dir above; conflict-free: the base lacks the path).
  # Residual noise after this fix: gender-neutral.dic and
  # font-variants.dic are absent for most languages IN THE DEB ITSELF
  # (verified: locale/en/ ships only emojis.dic + symbols.dic), so
  # those two "Failed to open file" lines remain on stock Ubuntu too -
  # upstream verbosity, not a packaging gap.
  /usr/share/speech-dispatcher:
    bind: $SNAP/usr/share/speech-dispatcher

environment:
  # pipewire-snap env/LD_LIBRARY_PATH precedent; host paths first so
  # base libraries keep precedence, staged libs fill the gaps.
  LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}/usr/lib:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR

plugs:
  # Client side of our own bus for the same-snap reader (T11 review
  # section 3 chain steps 1-5): grants orca the session bus socket and
  # the GetAddress verbs against org.a11y.Bus. Same-snap plug/slot
  # connections are implicit; external-client policy is gate work.
  a11y-bus-client:
    interface: dbus
    bus: session
    name: org.a11y.Bus

  # T16 finding: the greeter session is wayland; orca's Gdk needs the
  # session snap's relocated wayland socket (see the orca app comment).
  wayland-client:
    interface: wayland

  # T30 item 1 (T29 C4): the READER role. The plug carries the
  # accessibility-provider interface's connected-plug snippet (the
  # complete reader send-set, see the interface). The local plug name
  # must differ from the slot name (snapd forbids a plug and a slot
  # with the same name in one snap - the first clean-bake seed failed
  # on exactly that), so this is "reader" plugged by the orca app;
  # same-snap implicit connection to the bus app's slot.
  reader:
    interface: accessibility-provider

slots:
  dbus-a11y:
    interface: dbus
    bus: session
    name: org.a11y.Bus

  # T18 E2 (T19): the provider's own daemon must be able to mediate its
  # private accessibility bus, which needs the libapparmor kernel-query
  # capability (aa_find_mountpoint reads /proc/<pid>/mounts;
  # aa_query_label opens /sys/kernel/security/apparmor/.access O_RDWR).
  # The strict template grants neither, so dbus' bus_apparmor_pre_init
  # fail-opens and the private bus runs UNMEDIATED. The
  # accessibility-provider slot's permanent snippet carries the query
  # grants (thumbnailer-service precedent shape). The plain dbus slot
  # above keeps activation and name ownership; the provider-interface
  # consolidation (client rules etc.) is upstream work.
  accessibility-provider:
    interface: accessibility-provider

apps:
  bus:
    command: bin/launch-a11y-bus
    daemon: dbus
    daemon-scope: user
    # D8 (T17/T18): without this, the default refresh behaviour stops
    # the user daemon in every active user manager mid-session; the
    # launcher and private dbus-daemon die, every app's bridge
    # connection dies with them, and atk-bridge does not retry (the new
    # revision only activates on the next GetAddress, which running
    # apps never send again). endure keeps the OLD daemon process
    # running through the refresh (old mount namespace = old code) so
    # the session's bus and its clients survive. What it does NOT
    # cover: the new revision is not served until the daemon next
    # restarts (logout/reboot/manual), and a REVERT has the same shape.
    # T11 gate 6 (refresh/revert while Orca is enabled) still to run.
    refresh-mode: endure
    activates-on:
      - dbus-a11y
    slots:
      - dbus-a11y
      - accessibility-provider
    plugs:
      # T13 runtime finding: without network-bind the seccomp profile has
      # NO bind syscall at all (the template only adds `bind` when
      # AppArmor is not Full, or via interfaces - the private
      # dbus-daemon's unix socket bind then dies at seccomp with EPERM
      # before AppArmor mediation is even consulted). Same route the
      # speech-dispatcher app already uses; AppArmor's unix class still
      # mediates the actual address.
      - network-bind

  orca:
    command: bin/run-orca
    plugs:
      - a11y-bus-client
      # T19 phase 2: under REAL mediation (the private bus daemon now
      # queries AppArmor - T18 E2 closed) the reader needs the
      # bus=accessibility client rules: the desktop-legacy plug carries
      # the stock client recipe (dbus-accessibility-strict handshake,
      # the atspi sends against the registry, the event receive rule
      # and the conventional at-spi socket path). This is the same
      # client path any store a11y app uses.
      - desktop-legacy
      # T16 finding: orca on the greeter dies at Gdk keymap init because
      # the display never opens - the session's wayland socket lives at
      # /run/user/<uid>/snap.ubuntu-desktop-session/wayland-0 and the
      # orca profile has no grant for it (connect denial, class=file,
      # verbatim in T16). The wayland interface + a connect to the
      # session snap's wayland slot is the client grant; connect at
      # image assembly like the dbus edges.
      - wayland-client
      # T26 gap (a) (T25 gate-4 AVC, verbatim): in the WIZARD session
      # the orca profile was denied the X11 display connect -
      #   apparmor="DENIED" operation="connect" class="net"
      #   profile="snap.ubuntu-desktop-a11y.orca" ...
      #   peer_addr="@/tmp/.X11-unix/X1024" peer="unconfined"
      #   requested="send receive connect" denied="send connect"
      # gdm's wizard Xwayland (display :1024) listens on the
      # conventional filesystem socket AND the abstract @/tmp/.X11-
      # unix/X1024 address; GDK tries the abstract transport first, the
      # profile had no abstract-addr rule, the display came up None and
      # orca crashed at keymap init (AttributeError 'NoneType' ...
      # get_entries_for_keyval, x5 into the start limit). The x11 plug
      # carries exactly that grant (interfaces/builtin/x11.go:
      # addr="@/tmp/.X11-unix/X[0-9]*" send/receive/connect plus the
      # /tmp/.X11-unix bind layout). Connect edge: ubuntu-desktop-a11y:
      # x11 <-> ubuntu-desktop-session:x11 (the session snap owns the
      # x11 slot on this image) - wire it at image assembly like the
      # dbus/wayland edges; manual `snap connect` on dev images.
      - x11
      # T30 item 1 (T29 C4): the READER role - the "reader" plug (the
      # accessibility-provider interface's connected-plug snippet)
      # carries the complete reader send-set derived once from
      # at-spi2-core's interface XML (Text, EditableText, Action,
      # Component, Selection, Hypertext/Hyperlink, Document, Table/
      # TableCell, Cache, Value via Properties.Set, and the Registry/
      # DeviceEventController registration + synthetic-input sends),
      # instead of chasing interface-by-interface denials. Same-snap
      # implicit connection to the bus app's slot; the base declaration
      # keeps the plug install-gated + manual-connect for any other
      # snap.
      - reader

  speech-dispatcher:
    command: bin/run-speech-dispatcher
    daemon: simple
    daemon-scope: user
    restart-condition: on-failure
    # D8: same rationale as the bus app - a mid-session refresh must
    # not stop the speech daemon out from under a running reader.
    refresh-mode: endure
    # T47 (the C40 flag + the T41 STEP 6 confirmation): this app's
    # MAIN process is now the hung-server watchdog
    # (bin/speechd-supervisor.py) and the real server runs as its
    # child. restart-condition: on-failure can only ever see a server
    # that EXITS - the T41/T44-era wedge (server alive, unresponsive,
    # SIGTERM swallowed) never exits, so nothing here could recover
    # it and the reader stayed silent until a manual kill -9. The
    # supervisor closes that gap: it probes the socket every 15 s
    # with a connect + greeting read (10 s kill threshold after a
    # 30 s startup grace; normal greeting <1 s, measured), SIGKILLs
    # the server on a timeout, and respawns it against the SAME
    # listening fd - riding the T44-proved recovery (a killed server
    # self-heals via the socket unit; the next client gets rc=0).
    # Zero new AppArmor surface: the probe connect rides the
    # snap-private runtime-dir grant (template.go:393-394) and the
    # SIGKILL rides the same-snap signal grant (template.go:425-426).
    # No systemd WatchdogSec is available to snap daemons (snapcraft
    # does not expose it) - and none is needed, because the same
    # kill-and-recover primitive is provided by the supervisor with
    # the fd held in-process. Connections queued during a wedge stay
    # in the shared backlog and are served by the fresh server: the
    # watchdog does not fight the socket-activation unit below.
    sockets:
      # renderListenStream() rewrites $XDG_RUNTIME_DIR for user daemons
      # to %t/snap.<snapname> (wrappers/internal/service_socket_gen.go:53),
      # i.e. the deb's own socket path (%t/speech-dispatcher/speechd.sock)
      # translated into our snap-private runtime dir. Same-snap clients
      # (orca) reach it via $XDG_RUNTIME_DIR directly.
      speechd-socket:
        listen-stream: $XDG_RUNTIME_DIR/speech-dispatcher/speechd.sock
        socket-mode: 0666
    plugs:
      # snapd requires network-bind on apps that declare sockets
      # (snap/validate.go socket validation: "network-bind" interface
      # plug is required when sockets are used) - it mediates the
      # listen; this stays a local unix socket.
      - audio-playback
      - network-bind

parts:
  launchers:
    plugin: dump
    source: launchers
    build-packages:
      # T50: gcc compiles sem-snap-shim.c (see override-build; the
      # snapcraft LXD build env is minimal, nothing to assume).
      - gcc
      - libc6-dev
    organize:
      launch-a11y-bus: bin/launch-a11y-bus
      run-orca: bin/run-orca
      run-speech-dispatcher: bin/run-speech-dispatcher
      # T47: the speech-dispatcher unit's hung-server watchdog (the
      # supervisor exec'd by bin/run-speech-dispatcher; see the
      # speech-dispatcher app comment below and
      # notes/todo/a11y-work/T47-watchdog-lint.txt).
      speechd-supervisor.py: bin/speechd-supervisor.py
    override-build: |
      craftctl default
      # T50: the snap-scoped sem_open shim (launchers/sem-snap-shim.c
      # header comment) - LD_PRELOADed onto the speechd server + its
      # output-module children by bin/run-speech-dispatcher, so the
      # shipped sd_dummy module survives the strict template's scoped
      # /dev/shm grant instead of SEM_FAILED + SIGSEGV (the T20 E3
      # crash that kept sd_dummy stage-filtered out until now). The
      # shim IMPLEMENTS sem_open natively (open + ftruncate + mmap +
      # sem_init on the mapped sem.snap.<instance>.* path): glibc's own
      # sem_open creates its backing file via mknod at an internal
      # RANDOM temp name no template rule can grant (verbatim AVC
      # name="/dev/shm/sem.OwoID8" requested_mask="c" on the T50 VM),
      # so a name-mapping shim alone cannot work.
      mkdir -p "$CRAFT_PART_INSTALL/lib"
      gcc -shared -fPIC -O2 -Wall \
        -o "$CRAFT_PART_INSTALL/lib/sem-snap-shim.so" \
        "$CRAFT_PART_INSTALL/sem-snap-shim.c" -ldl
      # the dumped source must not ship in the snap
      rm -f "$CRAFT_PART_INSTALL/sem-snap-shim.c"
      test -s "$CRAFT_PART_INSTALL/lib/sem-snap-shim.so"

  a11y-stack:
    plugin: nil
    build-packages:
      # glib-compile-schemas (libglib2.0-bin on 26.04)
      - libglib2.0-bin
    override-stage: |
      craftctl default
      # T19 phase 3 (real-mediation matrix finding): the registry's
      # activation entry must carry the provider's label. dbus'
      # bus_apparmor_allows_send checks only the SENDER side for
      # activation, building the query with the entry's
      # AssumedAppArmorLabel; without it dst_label is empty and no
      # peer-label condition can match, so every confined
      # desktop-legacy client's first registry call (which triggers the
      # activation) is denied (verbatim T19 matrix: mask="send"
      # label="snap.ubuntu-desktop-a11y.orca" name="org.a11y.atspi.
      # Registry", no peer_label). snapd's own generated activation
      # files carry the same field (T13 §1b).
      printf 'AssumedAppArmorLabel=snap.ubuntu-desktop-a11y.bus\n' >> "$CRAFT_STAGE/usr/share/dbus-1/accessibility-services/org.a11y.atspi.Registry.service"
      # E3 (T20 strace finding): the deb's speechd.conf ships every
      # AddModule line AND DefaultModule commented out, so speechd
      # auto-detects whatever binaries sit in the module dir and falls
      # back to "first loaded" for the default output module - in this
      # snap that made dummy (or mbrola) the speaking module = silence
      # even with working audio. Enable the espeak-ng module and make
      # it the explicit default; the modules this snap actually
      # supports are selected in the stage: filter below.
      sed -i \
        's|^#AddModule "espeak-ng"\(.*\)$|AddModule "espeak-ng"\1|; s|^# DefaultModule espeak-ng$|DefaultModule espeak-ng|' \
        "$CRAFT_STAGE/etc/speech-dispatcher/speechd.conf"
      # T23 (first thin image with this snap baked): core26's stock
      # /etc/nsswitch.conf is "files extrausers" only, so a systemd
      # TRANSIENT uid is unresolvable inside this snap's mount
      # namespace. Every Ubuntu Core Desktop session user is such a uid
      # before the wizard creates a real account (the first-boot wizard
      # runs as gnome-initial-setup, uid 60578-transient; D7's
      # file-backed gdm uid 200 and T14's extrausers users keep
      # resolving through "files"/"extrausers"). The confined private
      # dbus-daemon needs its own uid's password record when a peer
      # connects, so it silently DROPPED every peer - verbatim journal:
      #   dbus-daemon[19313]: Could not get password database
      #     information for UID of current process: Looking up user ID
      #     60578: not found
      # with clients seeing NoReply/ENOTCONN (the T13 drop shape, via
      # the daemon's own-uid lookup rather than the peer's). Add
      # "systemd" to the chain: libnss_systemd resolves transient uids
      # from /run/systemd/users/<uid>, which is the HOST's /run shared
      # into this snap's namespace (the launcher already binds the bus
      # socket there, T19 D2) and granted read by the strict template
      # (template.go: /run/systemd/users/[0-9]* r). Content is core26
      # rev 750's stock file with the three user lines extended.
      # NOTE: the file must NOT be staged at /etc/nsswitch.conf itself -
      # snapcraft excludes prime files the base already ships, so the
      # staged copy would silently vanish (observed in the first T23
      # build: libnss_systemd staged, nsswitch.conf gone from the pack).
      # It is staged beside the base's file and bind-file'd over it via
      # the layout below (bind-file over an existing base file is the
      # supported shape; a symlink layout is not - snap-update-ns
      # change.go:187 "existing file in the way"). The file itself is
      # generated in override-build (part-owned content; see above).
    stage-packages:
      # --- bus payload (at-spi2-core ships at-spi-bus-launcher,
      # at-spi2-registryd, accessibility.conf and the
      # accessibility-services dir together, per T11 review section 3)
      - at-spi2-core
      - at-spi2-common
      # T14 userdb fix: the private dbus-daemon drops connections whose
      # uid it cannot resolve. Extrausers-only session users are resolved
      # through the NSS chain (base nsswitch already lists "extrausers"
      # and glibc dlopens libnss_extrausers.so.2 by soname from the
      # LD_LIBRARY_PATH this snap exports). Stage the module so the snap
      # is self-contained and does not depend on the base carrying it
      # (core26 rev 750 does ship it, at the non-multiarch path
      # /usr/lib/libnss_extrausers.so.2, which LD_LIBRARY_PATH also
      # reaches; the staged copy under $SNAP/usr/lib/<triplet> is the
      # guaranteed fallback). The module reads /var/lib/extrausers/{passwd,
      # group}, visible in-ns and granted r by the strict AppArmor template
      # (template.go: /etc/nsswitch.conf r, /var/lib/extrausers/{passwd,
      # group} r). Dynamic (userdbd-only) uids remain unresolvable in-ns
      # by any file-backed module - see T14 deliverable. T23 closes that
      # gap for the thin line: userdbd does not ship there, so the
      # "systemd" NSS source (libnss-systemd, staged below) is what
      # resolves the wizard's transient uid from the host's
      # /run/systemd/users/<uid> drop-in record.
      - libnss-extrausers
      # T23: resolves systemd transient uids (gnome-initial-setup) via
      # /run/systemd/users/<uid>; see the nsswitch.conf staged in
      # override-stage. core26 does not ship libnss_systemd (verified:
      # absent from the daemon's namespace on the thin image), so the
      # snap must stage it. Small deb; Depends on libc6 only.
      - libnss-systemd
      # --- orca + python/gi stack. T4's proven 26.04 set, minus
      # brltty/xbrlapi: braille hardware is a separate privilege domain
      # (T11 review section 2); orca's runtime imports DO include
      # brlapi/louis (braille.py/brlmon.py), so the python bindings and
      # libbrlapi come along, but no brltty daemon.
      # T4 gotcha applied: everything below is explicit, because the
      # build environment's dpkg state silently skips already-installed
      # entries from transitive resolution.
      - orca
      - python3-minimal
      - python3.14-minimal
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-gi
      - libgirepository-2.0-0
      - gir1.2-glib-2.0
      - gir1.2-atspi-2.0
      - gir1.2-gtk-3.0
      - gir1.2-pango-1.0
      - gir1.2-wnck-3.0
      - gir1.2-gstreamer-1.0
      - python3-brlapi
      - python3-louis
      - python3-cairo
      - python3-dasbus
      - python3-dbus
      - python3-psutil
      - python3-setproctitle
      - python3-speechd
      - libltdl7
      - gsettings-desktop-schemas
      - dconf-gsettings-backend
      # --- speech payload (T4: espeak-ng-data is its own 24MB package;
      # the espeak-ng OUTPUT MODULE is the separate
      # speech-dispatcher-espeak-ng package; the CLI is deliberately
      # not staged - not on stock either)
      - speech-dispatcher
      - speech-dispatcher-espeak-ng
      - speech-dispatcher-audio-plugins
      - libespeak-ng1
      - espeak-ng-data
      - libspeechd2
      # T13 finding: the staged pulse audio output plugin dlopens
      # libpulsecommon-<ver>.so, which ships with libpulse0 (not staged
      # before); without it the espeak-ng module dies at audio init
      # ("libpulsecommon-17.0.so: cannot open shared object file").
      - libpulse0
      # T16 finding: xkbcommon needs the XKB data (rules/evdev); the base
      # ships none and the layout above binds it to the compiled-in path.
      - xkb-data
      # T23 (first user-session run on thin): orca spawns xkbcomp while
      # setting up its keyboard grab; the user-session manager env has
      # no PATH reaching a host xkbcomp (the confined session snap's
      # environment broker PATH covers snap bins only), so the spawn
      # died with FileNotFoundError and the reader failed to start
      # exactly where the greeter (content-runtime env) worked. Stage
      # the tool; run-orca puts $SNAP/usr/bin on PATH.
      - x11-xkb-utils
    override-build: |
      craftctl default
      # T23: the modified NSS chain, generated INTO the part's install
      # dir. It must NOT be written in override-stage: snapcraft's prime
      # step zeroes files in the shared stage tree that no part owns
      # (observed twice in T23: a 488-byte stage file packed as a
      # 0-byte prime file); files in $CRAFT_PART_INSTALL are part-owned
      # content and flow to prime intact. See the layout above for why
      # this lands at etc/a11y-nsswitch.conf rather than the base's
      # etc/nsswitch.conf path.
      install -d -m 0755 "$CRAFT_PART_INSTALL/etc"
      printf '%s\n' \
        '# /etc/nsswitch.conf (ubuntu-desktop-a11y: core26 stock +' \
        '# "systemd" on the user lines - see the a11y-stack' \
        '# override-build comment, T23)' \
        'passwd:         files extrausers systemd' \
        'group:          files extrausers systemd' \
        'shadow:         files extrausers systemd' \
        'gshadow:        files' \
        '' \
        'hosts:          files mdns4_minimal [NOTFOUND=return] dns' \
        'networks:       files' \
        '' \
        'protocols:      db files' \
        'services:       db files' \
        'ethers:         db files' \
        'rpc:            db files' \
        '' \
        'netgroup:       nis' \
        > "$CRAFT_PART_INSTALL/etc/a11y-nsswitch.conf"
      # Fail the build if the staged chain is not what the daemon needs.
      grep -q '^passwd:.* files extrausers systemd$' \
        "$CRAFT_PART_INSTALL/etc/a11y-nsswitch.conf"
      grep -q '^shadow:.* files extrausers systemd$' \
        "$CRAFT_PART_INSTALL/etc/a11y-nsswitch.conf"
      # orca's prefs schema (org.gnome.Orca) and the session a11y
      # schemas (org.gnome.desktop.a11y.* via gsettings-desktop-schemas)
      # must be compiled for GSettings users inside the snap; glib
      # resolves schemas from $XDG_DATA_DIRS/glib-2.0/schemas and the
      # orca wrapper points XDG_DATA_DIRS at $SNAP/usr/share.
      # T30 item 6 (T29 C7): suppress (never grant) orca's periodic
      # inet socket attempts. The staged orca ships braille support
      # whose BrlAPI client retries a brltty connection forever with
      # the retry delay capped at one attempt per minute
      # (braille.py _BRLAPI_RETRY_MAX_DELAY_MS = 60000; the transient
      # connect worker thread resolves "localhost" into one inet plus
      # one inet6 TCP socket create per attempt - the ~232 denials/boot
      # under the orca profile, "failed af match" family=inet). This
      # snap ships no brltty daemon and braille hardware is a separate
      # privilege domain (T11 §2), so a BrlAPI server is unreachable
      # here by design: flip the compiled-in schema default instead of
      # granting network. A user db value can still re-enable braille
      # per session; with the reader off no socket is attempted at all.
      printf '%s\n' '[org.gnome.Orca.Braille]' 'enabled=false' \
        > "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas/50-ucd-snap-braille-off.gschema.override"
      glib-compile-schemas "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      # E3 (T20 strace finding): speechd's server unconditionally
      # load-requests the dummy and espeak-ng-fallback modules as
      # last-resort output modules (speechd.c ~818-835), and
      # auto-detects whatever else is in the module dir. The dummy and
      # generic module families create a POSIX semaphore in
      # module_init via glibc sem_open(), which ALWAYS creates
      # /dev/shm/sem.XXXXXX (mktemp) before link()ing the final name -
      # the strict template's snap-scoped /dev/shm grant can never
      # match the random temp name, sem_open returns SEM_FAILED, the
      # return value is UNCHECKED (dummy.c:77, generic.c:194) and the
      # first sem_wait() on it SIGSEGVs the module (verbatim trace:
      # openat("/dev/shm/sem.mP6OEw", O_RDWR|O_CREAT|O_EXCL) = -1
      # EACCES -> SIGSEGV -> server restart loop -> start-limit). The
      # DefaultModule override above selects it. sd_espeak-ng-mbrola is
      # a sd_generic-family module needing mbrola voices (not staged).
      # T50 REVISION: sd_dummy is SHIPPED again - bin/run-speech-
      # dispatcher now LD_PRELOADs the snap-scoped sem_open shim
      # (launchers/sem-snap-shim.c), which maps the module's unscoped
      # semaphore name into the template's granted
      # sem.snap.<instance>.* namespace, so the module initializes and
      # its last-resort "tell what is happening" function works; with
      # DefaultModule espeak-ng the dummy is never selected for normal
      # speech. WITHOUT the shim the shipped module would SIGSEGV at
      # init exactly as in the E3 trace (the sem name is
      # "/speechd-modules-dummy-%d", fixed in dummy.c:76 - it must not
      # ship unpatched). sd_generic stays excluded: nothing requests it
      # (its AddModule lines are commented out; auto-detect never runs
      # because espeak-ng is explicitly requested) and its sem_open
      # failure would only be dead weight; sd_espeak-ng-mbrola needs
      # mbrola voices (not staged).
      - -usr/lib/speech-dispatcher-modules/sd_generic
      - -usr/lib/speech-dispatcher-modules/sd_espeak-ng-mbrola
